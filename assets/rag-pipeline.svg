<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="RAG pipeline: query, embed, vector search, rerank, LLM, grounded answer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="150" fill="url(#bg)"/>
  <path d="M0 0V150 M30 0V150 M60 0V150 M90 0V150 M120 0V150 M150 0V150 M180 0V150 M210 0V150 M240 0V150 M270 0V150 M300 0V150 M330 0V150 M360 0V150 M390 0V150 M420 0V150 M450 0V150 M480 0V150 M510 0V150 M540 0V150 M570 0V150 M600 0V150 M630 0V150 M660 0V150 M690 0V150 M720 0V150 M750 0V150 M780 0V150 M810 0V150 M840 0V150 M870 0V150 M900 0V150 M930 0V150 M960 0V150 M990 0V150 M1020 0V150 M1050 0V150 M1080 0V150 M1110 0V150 M1140 0V150 M1170 0V150 M1200 0V150 M0 0H1200 M0 30H1200 M0 60H1200 M0 90H1200 M0 120H1200 M0 150H1200" stroke="#22d3ee" stroke-opacity=".04" stroke-width="1" fill="none"/>
  <rect x="26" y="44" width="158" height="62" rx="10" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="4.2s" begin="0.00s" repeatCount="indefinite"/>
  </rect>
  <text x="105" y="80" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e2e8f0">Query</text>
  <line x1="190" y1="75" x2="218" y2="75" stroke="#64748b" stroke-opacity=".5" stroke-width="1.4"/>
  <circle cx="190" cy="75" r="3.4" fill="#22d3ee" opacity="0" filter="url(#glow)">
    <animate attributeName="cx" from="190" to="218" dur="0.75s" begin="0.00s;pipe.end+0.00s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="0.75s" begin="0.00s;pipe.end+0.00s"/>
  </circle>
  <rect x="224" y="44" width="158" height="62" rx="10" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="4.2s" begin="0.60s" repeatCount="indefinite"/>
  </rect>
  <text x="303" y="80" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e2e8f0">Embed</text>
  <line x1="388" y1="75" x2="416" y2="75" stroke="#64748b" stroke-opacity=".5" stroke-width="1.4"/>
  <circle cx="388" cy="75" r="3.4" fill="#22d3ee" opacity="0" filter="url(#glow)">
    <animate attributeName="cx" from="388" to="416" dur="0.75s" begin="0.75s;pipe.end+0.75s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="0.75s" begin="0.75s;pipe.end+0.75s"/>
  </circle>
  <rect x="422" y="44" width="158" height="62" rx="10" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="4.2s" begin="1.20s" repeatCount="indefinite"/>
  </rect>
  <text x="501" y="80" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e2e8f0">Vector search</text>
  <line x1="586" y1="75" x2="614" y2="75" stroke="#64748b" stroke-opacity=".5" stroke-width="1.4"/>
  <circle cx="586" cy="75" r="3.4" fill="#22d3ee" opacity="0" filter="url(#glow)">
    <animate attributeName="cx" from="586" to="614" dur="0.75s" begin="1.50s;pipe.end+1.50s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="0.75s" begin="1.50s;pipe.end+1.50s"/>
  </circle>
  <rect x="620" y="44" width="158" height="62" rx="10" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="4.2s" begin="1.80s" repeatCount="indefinite"/>
  </rect>
  <text x="699" y="80" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e2e8f0">Rerank</text>
  <line x1="784" y1="75" x2="812" y2="75" stroke="#64748b" stroke-opacity=".5" stroke-width="1.4"/>
  <circle cx="784" cy="75" r="3.4" fill="#22d3ee" opacity="0" filter="url(#glow)">
    <animate attributeName="cx" from="784" to="812" dur="0.75s" begin="2.25s;pipe.end+2.25s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="0.75s" begin="2.25s;pipe.end+2.25s"/>
  </circle>
  <rect x="818" y="44" width="158" height="62" rx="10" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="4.2s" begin="2.40s" repeatCount="indefinite"/>
  </rect>
  <text x="897" y="80" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e2e8f0">LLM</text>
  <line x1="982" y1="75" x2="1010" y2="75" stroke="#64748b" stroke-opacity=".5" stroke-width="1.4"/>
  <circle cx="982" cy="75" r="3.4" fill="#22d3ee" opacity="0" filter="url(#glow)">
    <animate attributeName="cx" from="982" to="1010" dur="0.75s" begin="3.00s;pipe.end+3.00s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="0.75s" begin="3.00s;pipe.end+3.00s"/>
  </circle>
  <rect x="1016" y="44" width="158" height="62" rx="10" fill="#a78bfa" fill-opacity=".07" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="4.2s" begin="3.00s" repeatCount="indefinite"/>
  </rect>
  <text x="1095" y="80" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#e2e8f0">Grounded answer</text>
  <rect id="pipe" width="0" height="0" opacity="0">
    <animate attributeName="width" from="0" to="0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="600.0" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b">retrieval-augmented generation &#183; grounded in your own content, not model guesswork</text>
</svg>
